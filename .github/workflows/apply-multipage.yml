name: Apply FloodGuard multi-page navigation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-multipage.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-multipage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject multi-page navigation into homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./site-navigation-v2.js?v=2"></script>'
          if 'site-navigation-v2.js' not in s:
              if '</body>' in s:
                  s=s.replace('</body>',tag+'\n</body>',1)
              else:
                  s += '\n'+tag+'\n'
              p.write_text(s,encoding='utf-8')
              print('Injected site-navigation-v2.js')
          else:
              print('Navigation script already present')
          PY
      - name: Commit homepage navigation
        run: |
          if git diff --quiet -- index.html; then
            echo 'No homepage change needed'
            exit 0
          fi
          git config user.name 'FloodGuard Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Switch FloodGuard homepage navigation to real pages'
          git push
