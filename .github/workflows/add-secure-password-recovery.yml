name: Add secure password recovery flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-password-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch FloodGuard password recovery
        run: python scripts/patch_password_recovery.py
      - name: Commit patched login page
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "FloodGuard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add verified password recovery flow"
          git push
