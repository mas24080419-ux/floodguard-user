name: Apply FloodGuard website homepage

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-website-homepage.mjs'
      - '.github/workflows/apply-homepage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply homepage patch
        run: node scripts/apply-website-homepage.mjs
      - name: Commit generated homepage
        run: |
          if git diff --quiet -- index.html tests/desktop-smoke.mjs; then
            echo 'No homepage changes needed'
            exit 0
          fi
          git config user.name 'FloodGuard Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html tests/desktop-smoke.mjs
          git commit -m 'Build public website homepage for FloodGuard'
          git push origin HEAD:main
