name: FloodGuard desktop regression

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-core.html'
      - 'watchlist-email-v40.js'
      - 'site-pages.css'
      - 'site-luxe.css'
      - 'site-atelier-v47.css'
      - 'site-navigation-v2.js'
      - 'problem.html'
      - 'features.html'
      - 'how-it-works.html'
      - 'alerts.html'
      - 'ev.html'
      - 'rescue.html'
      - 'about.html'
      - 'sw.js'
      - 'tests/desktop-smoke.mjs'
      - '.github/workflows/desktop-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 >/tmp/floodguard-http.log 2>&1 &
          echo $! > /tmp/floodguard-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/floodguard-http.log
          exit 1
      - name: Run diversified desktop layout tests
        env:
          LOCAL_URL: http://127.0.0.1:4173
        run: node tests/desktop-smoke.mjs
      - name: Verify production static assets
        run: |
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/ -o /tmp/index.html
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/sw.js -o /tmp/sw.js
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/site-navigation-v2.js -o /tmp/site-nav.js
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/site-pages.css -o /tmp/site-pages.css
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/site-luxe.css -o /tmp/site-luxe.css
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/site-atelier-v47.css -o /tmp/site-atelier.css
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/watchlist-email-v40.js -o /tmp/watch.js
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/problem.html -o /tmp/problem.html
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/features.html -o /tmp/features.html
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/how-it-works.html -o /tmp/how.html
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/alerts.html -o /tmp/alerts.html
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/ev.html -o /tmp/ev.html
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/rescue.html -o /tmp/rescue.html
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/about.html -o /tmp/about.html
          cat /tmp/site-luxe.css /tmp/site-atelier.css > /tmp/site-theme.css
          grep -q 'floodguard-user-v47-atelier-luxury-ui' /tmp/sw.js
          grep -q 'site-atelier-v47.css' /tmp/sw.js
          grep -q 'site-atelier-v47.css' /tmp/site-pages.css
          grep -q 'FloodGuard Atelier UI v47' /tmp/site-atelier.css
          grep -q 'atelierHeroIn' /tmp/site-atelier.css
          grep -q 'wh-grid' /tmp/site-atelier.css
          grep -q 'feature-bento' /tmp/site-theme.css
          grep -q 'flow-roadmap' /tmp/site-theme.css
          grep -q 'alert-console' /tmp/site-theme.css
          grep -q 'ev-console' /tmp/site-theme.css
          grep -q 'rescue-console' /tmp/site-theme.css
          grep -q 'about-story' /tmp/site-theme.css
          grep -q 'installAtelierTheme' /tmp/site-nav.js
          grep -q 'FG_SITE_NAV_V4' /tmp/site-nav.js
          grep -q 'VẤN ĐỀ NGẬP ĐÔ THỊ' /tmp/problem.html
          grep -q 'feature-bento' /tmp/features.html
          grep -q 'flow-roadmap' /tmp/how.html
          grep -q 'alert-console' /tmp/alerts.html
          grep -q 'ev-console' /tmp/ev.html
          grep -q 'rescue-console' /tmp/rescue.html
          grep -q 'about-story' /tmp/about.html
          grep -q 'FG40_WATCHLIST_EMAIL' /tmp/watch.js
          echo 'PRODUCTION_ATELIER_V47_OK'
