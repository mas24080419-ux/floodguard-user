name: FloodGuard regression

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.test.cjs'
      - 'live-conditions.js'
      - 'live-conditions.css'
      - 'floodguard-design-system.css'
      - 'tests/design-system.mjs'
      - 'index.html'
      - 'app-core.html'
      - 'watchlist-email-v40.js'
      - 'site-pages.css'
      - 'site-luxe.css'
      - 'site-atelier-v47.css'
      - 'site-cinematic-v48.css'
      - 'site-editorial-v49.css'
      - 'site-hide-ev-v50.css'
      - 'site-action-v59.css'
      - 'site-navigation-v2.js'
      - 'problem.html'
      - 'features.html'
      - 'how-it-works.html'
      - 'alerts.html'
      - 'ev.html'
      - 'rescue.html'
      - 'about.html'
      - 'data.html'
      - 'faq.html'
      - 'contact.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'sw.js'
      - 'tests/desktop-smoke.mjs'
      - 'tests/mobile-seo-smoke.mjs'
      - 'tests/deep-functional.mjs'
      - '.github/workflows/desktop-regression.yml'
  push:
    branches: [main]
    paths:
      - '**/*.test.cjs'
      - 'live-conditions.js'
      - 'live-conditions.css'
      - 'floodguard-design-system.css'
      - 'tests/design-system.mjs'
      - 'index.html'
      - 'app-core.html'
      - 'watchlist-email-v40.js'
      - 'site-pages.css'
      - 'site-luxe.css'
      - 'site-atelier-v47.css'
      - 'site-cinematic-v48.css'
      - 'site-editorial-v49.css'
      - 'site-hide-ev-v50.css'
      - 'site-action-v59.css'
      - 'site-navigation-v2.js'
      - 'problem.html'
      - 'features.html'
      - 'how-it-works.html'
      - 'alerts.html'
      - 'ev.html'
      - 'rescue.html'
      - 'about.html'
      - 'data.html'
      - 'faq.html'
      - 'contact.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'sw.js'
      - 'tests/desktop-smoke.mjs'
      - 'tests/mobile-seo-smoke.mjs'
      - 'tests/deep-functional.mjs'
      - '.github/workflows/desktop-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Install DOM test dependencies
        run: npm ci --prefix editor-tools
      - name: Run logic and DOM regression tests
        run: node --test *.test.cjs tests/*.test.cjs
      - name: Start local static server
        run: |
          python3 -m http.server 4173 >/tmp/floodguard-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/floodguard-http.log
          exit 1
      - name: Run design system checks
        env:
          LOCAL_URL: http://127.0.0.1:4173
        run: node tests/design-system.mjs
      - name: Run desktop smoke tests
        env:
          LOCAL_URL: http://127.0.0.1:4173
        run: node tests/desktop-smoke.mjs
      - name: Run mobile and SEO smoke tests
        env:
          LOCAL_URL: http://127.0.0.1:4173
        run: node tests/mobile-seo-smoke.mjs
      - name: Run deep functional QA
        env:
          LOCAL_URL: http://127.0.0.1:4173
        run: node tests/deep-functional.mjs
      - name: Verify production design system
        if: github.event_name == 'push'
        run: |
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/sw.js -o /tmp/sw.js
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/site-pages.css -o /tmp/site-pages.css
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/site-hide-ev-v50.css -o /tmp/hide.css
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/ev.html -o /tmp/ev.html
          curl -fLsS --max-time 30 https://floodguard-user.onrender.com/app-core.html -o /tmp/app.html
          grep -q 'floodguard-user-v74-reliability' /tmp/sw.js
          grep -q 'site-hide-ev-v50.css' /tmp/sw.js
          grep -q 'site-hide-ev-v50.css' /tmp/site-pages.css
          grep -q 'ev.html' /tmp/hide.css
          grep -q "location.replace('./features.html')" /tmp/ev.html
          grep -Eqi 'Trạm sạc|EV' /tmp/app.html
          echo 'PRODUCTION_PUBLIC_EV_HIDDEN_V50_OK'
