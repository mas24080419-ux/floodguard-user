name: Install password OTP v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-otp-ui:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix patch replacement escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch_password_otp.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("helpers_pattern.sub(new_helpers, s, count=1)", "helpers_pattern.sub(lambda _m: new_helpers, s, count=1)")
          s=s.replace("handlers_pattern.sub(new_handlers, s, count=1)", "handlers_pattern.sub(lambda _m: new_handlers, s, count=1)")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Patch FloodGuard OTP recovery UI
        run: python scripts/patch_password_otp.py
      - name: Commit patched login page
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "FloodGuard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add 6-digit OTP password recovery UI"
          git push
