name: Install password OTP v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-otp-ui:
    if: github.actor != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch FloodGuard OTP recovery UI
        run: python scripts/patch_password_otp.py
      - name: Commit patched login page
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "FloodGuard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add 6-digit OTP password recovery UI"
          git push
